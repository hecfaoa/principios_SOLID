# Configuración para Base de Datos H2
spring.datasource.url=jdbc:h2:mem:facturaciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Permite que JPA cree/actualice las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activa la consola web de H2 para inspeccionar datos en navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console